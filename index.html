<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguimiento de Cursos</title>
  <style>
    /* Tema Oscuro (por defecto) */
    :root[data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --completed: #22c55e;
      --completed-hover: #16a34a;
      --pending: #334155;
      --pending-hover: #475569;
    }

    /* Tema Claro */
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --completed: #22c55e;
      --completed-hover: #16a34a;
      --pending: #e2e8f0;
      --pending-hover: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .controls-right {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    select, button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      border-color: var(--primary);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      font-weight: 600;
      border: none;
    }

    :root[data-theme="dark"] .btn-primary {
      color: #0f172a;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .stats {
      margin-top: 1rem;
    }

    .stats-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .progress-bar-bg {
      background: var(--bg);
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, var(--primary), var(--completed));
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 0.6rem;
      margin-bottom: 2rem;
    }

    .lesson-btn {
      aspect-ratio: 1;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--pending);
      color: var(--text);
      user-select: none;
      transition: all 0.2s ease;
    }

    .lesson-btn:hover {
      background: var(--pending-hover);
    }

    .lesson-btn.completed {
      background: var(--completed);
      border-color: var(--completed);
      color: #ffffff;
    }

    .lesson-btn.completed:hover {
      background: var(--completed-hover);
    }

    /* Sección de Notas */
    .notes-section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .notes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }

    .notes-header h3 {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .notes-status {
      font-size: 0.8rem;
      color: var(--text-muted);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .notes-status.visible {
      opacity: 1;
    }

    textarea.notes-input {
      width: 100%;
      min-height: 110px;
      padding: 0.8rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.5;
      resize: vertical;
      transition: border-color 0.2s ease;
    }

    textarea.notes-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      display: none;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 400px;
    }

    .modal h3 {
      margin-bottom: 1rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .form-group input {
      width: 100%;
      padding: 0.6rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="top-bar">
        <div>
          <select id="courseSelect" onchange="switchCourse()"></select>
        </div>
        <div class="controls-right">
          <button id="themeToggle" onclick="toggleTheme()">☀️ Claro</button>
          <button class="btn-primary" onclick="openModal()">+ Nuevo Curso</button>
        </div>
      </div>

      <div class="stats">
        <div class="stats-info">
          <span>Progreso: <strong id="progressText">0 / 0</strong></span>
          <span id="percentText">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progressBar" class="progress-bar-fill"></div>
        </div>
      </div>
    </header>

    <main id="lessonsGrid" class="grid"></main>

    <!-- Sección de Notas por Curso -->
    <section class="notes-section">
      <div class="notes-header">
        <h3>📝 Notas del Curso</h3>
        <span id="notesStatus" class="notes-status">Guardado ✓</span>
      </div>
      <textarea 
        id="courseNotes" 
        class="notes-input" 
        placeholder="Escribe notas rápidas, temas para repasar o enlaces aquí..."
        oninput="handleNotesInput()"></textarea>
    </section>

    <div class="actions">
      <button onclick="exportData()">Exportar JSON</button>
      <button onclick="importData()">Importar JSON</button>
      <input type="file" id="importInput" style="display: none;" onchange="handleImport(event)" accept=".json">
    </div>
  </div>

  <!-- Modal Nuevo Curso -->
  <div id="courseModal" class="modal-backdrop">
    <div class="modal">
      <h3>Agregar Nuevo Curso</h3>
      <div class="form-group">
        <label for="courseName">Nombre del curso</label>
        <input type="text" id="courseName" placeholder="Ej. Redes de Computadoras">
      </div>
      <div class="form-group">
        <label for="totalLessons">Cantidad de lecciones</label>
        <input type="number" id="totalLessons" min="1" placeholder="Ej. 50">
      </div>
      <div class="modal-actions">
        <button onclick="closeModal()">Cancelar</button>
        <button class="btn-primary" onclick="addCourse()">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'tracker_courses_data';
    const ACTIVE_KEY = 'tracker_active_course';
    const THEME_KEY = 'tracker_theme_preference';

    const defaultData = {
      "sistemas-operativos": {
        id: "sistemas-operativos",
        name: "Sistemas Operativos",
        total: 102,
        completed: [],
        notes: ""
      }
    };

    let coursesData = {};
    let activeCourseId = "";
    let notesTimeout = null;

    function init() {
      initTheme();

      const savedData = localStorage.getItem(STORAGE_KEY);
      if (savedData) {
        coursesData = JSON.parse(savedData);
      } else {
        coursesData = defaultData;
        saveToStorage();
      }

      const savedActive = localStorage.getItem(ACTIVE_KEY);
      if (savedActive && coursesData[savedActive]) {
        activeCourseId = savedActive;
      } else {
        activeCourseId = Object.keys(coursesData)[0];
      }

      renderCourseSelect();
      renderApp();
    }

    /* Tema */
    function initTheme() {
      const savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeButtonLabel(savedTheme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem(THEME_KEY, newTheme);
      updateThemeButtonLabel(newTheme);
    }

    function updateThemeButtonLabel(theme) {
      const btn = document.getElementById('themeToggle');
      if (btn) {
        btn.textContent = theme === 'dark' ? '☀️ Claro' : '🌙 Oscuro';
      }
    }

    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(coursesData));
      localStorage.setItem(ACTIVE_KEY, activeCourseId);
    }

    function renderCourseSelect() {
      const select = document.getElementById('courseSelect');
      select.innerHTML = '';
      
      Object.values(coursesData).forEach(course => {
        const option = document.createElement('option');
        option.value = course.id;
        option.textContent = course.name;
        if (course.id === activeCourseId) option.selected = true;
        select.appendChild(option);
      });
    }

    function switchCourse() {
      const select = document.getElementById('courseSelect');
      activeCourseId = select.value;
      saveToStorage();
      renderApp();
    }

    function renderApp() {
      const course = coursesData[activeCourseId];
      if (!course) return;

      // Renderizar grilla
      const grid = document.getElementById('lessonsGrid');
      grid.innerHTML = '';

      for (let i = 1; i <= course.total; i++) {
        const btn = document.createElement('button');
        btn.className = 'lesson-btn';
        btn.textContent = i;

        if (course.completed.includes(i)) {
          btn.classList.add('completed');
        }

        btn.onclick = () => toggleLesson(i);
        grid.appendChild(btn);
      }

      // Renderizar notas del curso activo
      const notesInput = document.getElementById('courseNotes');
      notesInput.value = course.notes || '';

      // Actualizar estadísticas
      const total = course.total;
      const done = course.completed.length;
      const percentage = total > 0 ? Math.round((done / total) * 100) : 0;

      document.getElementById('progressText').textContent = `${done} / ${total}`;
      document.getElementById('percentText').textContent = `${percentage}%`;
      document.getElementById('progressBar').style.width = `${percentage}%`;
    }

    function toggleLesson(lessonNum) {
      const course = coursesData[activeCourseId];
      const index = course.completed.indexOf(lessonNum);

      if (index === -1) {
        course.completed.push(lessonNum);
      } else {
        course.completed.splice(index, 1);
      }

      saveToStorage();
      renderApp();
    }

    /* Manejo de Notas con Autoguardado (Debounce) */
    function handleNotesInput() {
      const notesText = document.getElementById('courseNotes').value;
      const status = document.getElementById('notesStatus');

      status.textContent = 'Guardando...';
      status.classList.add('visible');

      clearTimeout(notesTimeout);
      notesTimeout = setTimeout(() => {
        if (coursesData[activeCourseId]) {
          coursesData[activeCourseId].notes = notesText;
          saveToStorage();
          status.textContent = 'Guardado ✓';
          setTimeout(() => status.classList.remove('visible'), 1500);
        }
      }, 500);
    }

    /* Modal */
    function openModal() {
      document.getElementById('courseModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('courseModal').classList.remove('active');
      document.getElementById('courseName').value = '';
      document.getElementById('totalLessons').value = '';
    }

    function addCourse() {
      const nameInput = document.getElementById('courseName').value.trim();
      const totalInput = parseInt(document.getElementById('totalLessons').value);

      if (!nameInput || isNaN(totalInput) || totalInput <= 0) {
        alert('Por favor ingresa un nombre y una cantidad válida de lecciones.');
        return;
      }

      const id = nameInput.toLowerCase().replace(/[^a-z0-9]/g, '-') + '-' + Date.now();
      coursesData[id] = {
        id: id,
        name: nameInput,
        total: totalInput,
        completed: [],
        notes: ""
      };

      activeCourseId = id;
      saveToStorage();
      renderCourseSelect();
      renderApp();
      closeModal();
    }

    /* Import / Export */
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(coursesData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `progreso_cursos_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData() {
      document.getElementById('importInput').click();
    }

    function handleImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (typeof imported === 'object') {
            coursesData = imported;
            activeCourseId = Object.keys(coursesData)[0] || "";
            saveToStorage();
            renderCourseSelect();
            renderApp();
            alert('¡Progreso importado con éxito!');
          }
        } catch (err) {
          alert('Error al leer el archivo JSON.');
        }
      };
      reader.readAsText(file);
    }

    init();
  </script>
</body>
</html>
